<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="./css/carrinho.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Audiowide&family=Exo+2:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARRINHO</title>
</head>

<body>
    <main>
        <section class="resumo-pedido">
            <div class="titulo-secao">

            </div>
            <div class="lista-pedido-itens">
                <a href="#" class="pedido-item"> <img src="https://placehold.co/150x190?text=Livro1" alt="Livro 1">
                    <div class="item-informacoes">
                        <h2>Livro 1</h2>
                        <p>Autor 1</p>
                        <p>Romance</p>
                        <h3>R$ 29,90</h3>
                    </div>
                    <div class="item-acoes">
                        <h4>Remover Item</h4> <button>X</button>
                    </div>
                </a>

                <a href="#" class="pedido-item"> <img src="https://placehold.co/150x190?text=Livro1" alt="Livro 1">
                    <div class="item-informacoes">
                        <h2>Livro 1</h2>
                        <p>Autor 1</p>
                        <p>Romance</p>
                        <h3>R$ 29,90</h3>
                    </div>
                    <div class="item-acoes">
                        <h4>Remover Item</h4> <button>X</button>
                    </div>
                </a>

                <a href="#" class="pedido-item"> <img src="https://placehold.co/150x190?text=Livro1" alt="Livro 1">
                    <div class="item-informacoes">
                        <h2>Livro 1</h2>
                        <p>Autor 1</p>
                        <p>Romance</p>
                        <h3>R$ 29,90</h3>
                    </div>
                    <div class="item-acoes">
                        <h4>Remover Item</h4> <button>X</button>
                    </div>
                </a>
            </div>
        </section>

        <section class="informacoes-pedido">
            <div class="titulo-secao">
                <h1>TOTAL DO CARRINHO:</h1>
            </div>
            <div class="lista-informacoes-itens">
                <div class="informacao-item">
                    <h3>Livro1</h3>
                    <h4>R$ 29,90</h4>
                </div>
                <div class="informacao-item">
                    <h3>Livro2</h3>
                    <h4>R$ 34,90</h4>
                </div>
                <div class="informacao-item">
                    <h3>Livro3</h3>
                    <h4>R$ 39,90</h4>
                </div>
            </div>
            <div class="total-pagar">
                <h2 class="titulo-total-pagar">
                    Preço Total a Pagar
                </h2>
                <span>R$ 67,00</span>
            </div>
            <button>Compre agora</button>
        </section>

    </main>
</body>

</html>
